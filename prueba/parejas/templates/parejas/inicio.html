<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Espacio ❤️</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e0, #ead6ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .contenedor {
            width: 100%;
            max-width: 850px;
            background: white;
            border-radius: 25px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }
        .corazon { font-size: 70px; }
        h1 {
            color: #e84368;
            font-size: 45px;
            margin: 10px 0;
        }
        p { color: #666; font-size: 18px; }
        .botones {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 35px;
            flex-wrap: wrap;
        }
        .boton {
            display: inline-block;
            padding: 15px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 17px;
            transition: transform 0.2s ease;
        }
        .boton:hover { transform: scale(1.05); }
        .crear { background: #e84368; color: white; }
        .unirse { background: #eeeeee; color: #333; }
        .secundario { margin-top: 25px; }
        .secundario a {
            color: #d81b60;
            text-decoration: none;
            font-weight: bold;
        }
        @media (max-width: 600px) {
            body { padding: 14px; }
            .contenedor { padding: 32px 20px; border-radius: 18px; }
            .corazon { font-size: 54px; }
            h1 { font-size: 34px; }
            p { font-size: 16px; line-height: 1.5; }
            .botones { gap: 12px; margin-top: 24px; }
            .boton { width: 100%; padding: 14px 16px; }
            .secundario { line-height: 2; }
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="corazon">❤️</div>
        <h1>Nuestro Espacio</h1>
        <p>Un lugar privado para guardar todos nuestros recuerdos juntos.</p>

        <div class="botones">
            <a href="{% url 'registro' %}" class="boton crear">Crear pareja</a>
            <a href="{% url 'login' %}" class="boton unirse">Unirme con un código</a>
        </div>

        <div class="secundario">
            <a href="{% url 'crear_pareja' %}">Crear pareja directamente</a>
            |
            <a href="{% url 'unirse_pareja' %}">Unirme con código</a>
        </div>
    </div>
</body>
</html>
